:root{
  --surround:#e9ecf3;
  --toast-bg:#1d2d3e; --toast-fg:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--surround:#00081c;--toast-bg:#ffffff;--toast-fg:#1d2d3e;color-scheme:dark}
}
:root[data-theme="dark"]{--surround:#00081c;--toast-bg:#ffffff;--toast-fg:#1d2d3e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--surround);overflow:hidden;font-family:"72","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:3px solid #ffb300;outline-offset:3px}

#fit{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#fff}
.abs{position:absolute}
img.abs{display:block;max-width:none;pointer-events:none;user-select:none}

/* screens */
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.screen.active{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}

/* ---------- Welcome ---------- */
#welcome{background:linear-gradient(28deg,#00144b 0%,#002376 45%,#0040b1 100%)}
.start-btn{position:absolute;left:797px;top:935px;width:327px;height:67.6px;border-radius:34px;
  background:linear-gradient(104.45deg,#6731fc 9.4%,#c205df 90.6%);color:#fff;font-weight:700;font-size:29px;
  display:flex;align-items:center;justify-content:center;gap:16px;transition:transform .2s ease,filter .2s ease}
.start-btn:hover{filter:brightness(1.08)}
.start-btn:active{transform:scale(.97)}
.start-btn img{width:30.35px;height:30.35px;transform:rotate(-90deg);transition:transform .3s ease}
.start-btn:hover img{transform:rotate(-90deg) translateY(4px)}
.welcome-hit{position:absolute;inset:0;cursor:pointer}

/* ---------- Hub ---------- */
.hub-tagline{position:absolute;left:550px;top:147px;width:845px;text-align:center;color:#fff;font-size:24px;line-height:24px}
.card{position:absolute;top:223px;width:272.3px;height:484.3px;border-radius:21px 21px 0 0;transition:transform .25s ease,filter .25s ease}
.card img{width:100%;height:100%;display:block;pointer-events:none}
.card:hover{transform:translateY(-8px);filter:drop-shadow(0 16px 24px rgba(0,10,50,.45))}
.card:active{transform:translateY(-4px) scale(.98)}
.card:focus-visible{outline-offset:6px}
.hub-buttons{position:absolute;left:662px;top:786px;width:614px;display:flex;flex-direction:column;gap:24.8px}
.pill{height:57.26px;border:1.91px solid #0040b0;border-radius:28.6px;color:#000;font-size:22.9px;background:#fff;transition:background .2s ease,color .2s ease}
.pill:hover{background:#0040b0;color:#fff}
.pill:active{transform:scale(.98)}
.logo-sap{left:1771px;top:35px;width:120px;height:59px}
.logo-srs{position:absolute;left:36px;top:53px;width:120.4px;height:120px}
.logo-srs img{width:100%;height:100%;display:block}

/* ---------- Line of business ---------- */
.lob-base{position:absolute;inset:0;background:linear-gradient(to top,#002a86 45.3%,#001449 94.6%)}
.lob-shade{position:absolute;left:0;top:-7px;width:1925px;height:1082px;background:linear-gradient(180.5deg,rgb(1,29,97) 14.2%,rgba(0,42,134,0) 120%);opacity:.72}
.panel{position:absolute;left:232px;top:18px;width:581.76px;height:1047px;border-radius:42px;background:#fff;overflow:hidden;
  box-shadow:0 -5.6px 36.4px rgba(97,103,169,.16),0 5.6px 36.4px rgba(97,103,169,.16)}
.panel-glow{position:absolute;left:1px;bottom:0;width:580.4px;height:405.6px}
.panel-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16.8px 16.8px 5.6px}
.panel-title{display:flex;align-items:center;gap:11.2px;color:#5d36ff;font-weight:700;font-size:19.58px}
.round-btn{width:61.5px;height:61.5px;border-radius:50%;background:#f5f6f7;display:flex;align-items:center;justify-content:center;transition:background .2s}
.round-btn:hover{background:#e6e8ec}
.round-btn img{width:22.4px;height:22.4px}
.panel-body{position:relative;padding:11.2px 22.4px 22.4px;display:flex;flex-direction:column;align-items:center;gap:22.4px}
.stamp{color:#8396a8;font-size:19.58px;line-height:28px;text-align:center}
.stamp b{font-weight:700}
.bubble{font-size:18.58px;line-height:29.37px;color:#1d2d3e;padding:11.2px 22.4px;max-width:537px}
.q{align-self:flex-end;background:#eae5ff;border-radius:11.2px 11.2px 0 11.2px}
.a{align-self:flex-start;background:#eff1f2;border-radius:11.2px 11.2px 11.2px 0}
.a b{font-weight:600}

.next-btn{position:absolute;height:62px;border-radius:31px;border:3.39px solid #0070f2;padding:2.5px;background:#0070f2;background-clip:content-box;
  color:#fff;font-size:25.4px;display:flex;align-items:center;justify-content:center;transition:filter .2s,transform .2s}
.next-btn:hover{filter:brightness(1.12)}
.next-btn:active{transform:scale(.97)}

.rail{position:absolute;left:74px;top:402px;width:59.26px;height:287px;border-radius:10.2px;background:rgba(255,255,255,.2);box-shadow:0 0 8.5px rgba(0,0,0,.25)}
.rail .home{position:absolute;left:11.85px;top:14.4px;width:35.6px;height:35.6px}
.rail .back{position:absolute;left:5.93px;top:75.3px;width:47.4px;height:47.4px;border-radius:6.8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.rail .back img{width:36.4px;height:36.4px;transform:rotate(90deg)}
.rail .fwd{position:absolute;left:5.93px;top:225.2px;width:47.4px;height:47.4px}
.rail img{display:block;width:100%;height:100%}
.rail button:hover{filter:brightness(1.25)}
.dots{position:absolute;left:0;top:138px;width:100%;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.dot{width:5px;height:5px;border-radius:50%;background:#fa4f96;transition:all .3s ease}
.dot.on{width:11px;height:11px;background:#feadc8}

/* content cards */
.ccard{position:absolute;transform-origin:50% 50%}
.cx-grid-title{position:absolute;left:0;top:16.8px;width:100%;text-align:center;font-weight:700;font-size:25.4px;line-height:1.2;color:#0f1115}
.cx-grid-title span{font-weight:900;color:#fa4f96}
.force-tile{position:absolute;width:68.6px;height:68.6px;border:1.27px solid #ba066c;border-radius:9.3px;background:#fff;display:flex;align-items:center;justify-content:center}
.force-tile img{width:42.3px;height:42.3px}
.force-text{position:absolute;text-align:center;font-size:20.3px;color:#0f1115;line-height:1.2}

.box{background:linear-gradient(to bottom,#fff 18.75%,#ffdcf3 86.5%);border:.85px solid #fe83ae;border-radius:28.8px;padding:22px 25.4px}
.box-title{height:53.4px;border-radius:42.4px;background:#fff0fa;display:flex;align-items:center;justify-content:center;gap:15.3px;font-size:25.4px;color:#0f1115}
.box-title img{width:29.7px;height:29.7px}
.cells{display:flex;flex-direction:column}
.cell{display:flex;align-items:center;gap:23.7px}
.cell + .cell{border-top:1px solid rgba(250,79,150,.35)}
.cell-ic{flex:none;width:68.7px;height:68.7px;border-radius:11.9px;background:#feadc8;display:flex;align-items:center;justify-content:center}
.cell-ic img{width:42.4px;height:42.4px}
.cell-txt{font-size:18.65px;line-height:1.2;color:#000}
.cell-txt h3{margin:0 0 5px;font-size:inherit;font-weight:700;color:#df1278}
.cell-txt p{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:4.2px;margin-top:12.7px;max-width:400px}
.tag{height:18.67px;padding:0 4.2px;border-radius:4.2px;background:#fe83ae;color:#fff;font-size:15.27px;line-height:18.67px;white-space:nowrap}

.stats{background:#fff;border:1.69px solid #fe83ae;border-radius:27.9px;padding:17.7px}
.srow{display:flex;gap:14.36px;margin-bottom:14.36px}
.stile{position:relative;width:193.4px;height:165.5px;border-radius:15.2px;padding:16.9px 21.1px 5.9px;color:#000}
.stile .tri{position:absolute;left:21.1px;top:16.9px;width:151.2px;height:74.3px}
.stile .num{position:relative;height:74.3px;padding:11px 0 0 10px;font-weight:700;font-size:45.6px;line-height:1.2;white-space:nowrap}
.stile .num small{font-weight:400;font-size:33.8px}
.stile p{position:relative;margin:4.2px 0 0;font-size:13.5px;line-height:1.2}
.stile.w{color:#fff}
.demo-box{position:relative;height:195.9px;border-radius:15.2px;background:#feadc8;overflow:hidden}
.demo-box img{position:absolute;left:295.6px;top:32.1px;width:292.4px;height:163.7px;object-fit:cover}
.demo-box h3{position:absolute;left:31.25px;top:49px;margin:0;font-weight:600;font-size:23.6px;line-height:1.2;color:#000}
.demo-btn{position:absolute;left:31.25px;top:124.1px;padding:8.4px 47.3px;border-radius:18.6px;background:#fff;color:#0064d9;font-weight:600;font-size:16.9px;transition:background .2s}
.demo-btn:hover{background:#eef5ff}

/* timeline from Figma: 2.4s, button → question → answer → card */
.step .t-btn{animation:fadeIn .5s ease-out both}
.step .t-q{animation:rise .5s ease-out .3s both}
.step .t-a{animation:rise .5s ease-out 1.1s both}
.step .t-card{animation:zoomIn .5s ease-out 1.68s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(100px)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(1.2)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .step .t-btn,.step .t-q,.step .t-a,.step .t-card{animation:none}
  .screen{transition:none}
}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--toast-bg);color:var(--toast-fg);font-size:15px;padding:12px 20px;border-radius:24px;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:all .3s ease;z-index:10;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<script>
(function(){
  const stage=document.getElementById('stage'), fit=document.getElementById('fit');
  function scale(){
    const w=fit.clientWidth,h=fit.clientHeight,s=Math.min(w/1920,h/1080);
    stage.style.transform=`translate(${(w-1920*s)/2}px,${(h-1080*s)/2}px) scale(${s})`;
  }
  addEventListener('resize',scale); scale();

  const CX=[
    {q:'What challenges are revenue and CX teams facing?',a:'Revenue organizations face four structural pressures in 2026 and SAP’s own go-to-market operations are no exception. Here is what the market demands:'},
    {q:'Show me the major challenges for SAP within the CX area',a:'Here is an overview of the <b>structural challenges</b> SAP’s own revenue organization faces, and the <b>strategic priorities</b> it has organized its response around:'},
    {q:'How does SAP tackle these challenges?',a:'SAP uses its own solutions to achieve its strategic priorities:'},
    {q:null,a:'Check out SAP’s outcomes in the CX area and view the demos to see our sales technology at work. With this, SAP progresses on its journey toward Autonomous CX.'}
  ];
  let cxStep=1;

  function renderCx(n){
    cxStep=n;
    const d=CX[n-1], chat=document.getElementById('cx-chat'), st=document.getElementById('cx-stage');
    chat.className='panel-body step';
    chat.innerHTML='<div class="stamp"><b>Welcome</b> inside SAP</div>'+
      (d.q?`<div class="bubble q t-q">${d.q}</div>`:'')+
      `<div class="bubble a ${d.q?'t-a':'t-q'}">${d.a}</div>`;
    st.className='step';
    st.innerHTML='';
    st.appendChild(document.getElementById('tpl-cx-'+n).content.cloneNode(true));
    // replay animations
    void chat.offsetWidth;
    document.querySelectorAll('#s-cx .dot').forEach((el,i)=>el.classList.toggle('on',i===n-1));
  }

  function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='s-'+id));
  }

  function route(){
    const h=(location.hash||'#welcome').slice(1);
    const m=h.match(/^cx-([1-4])$/);
    if(m){renderCx(+m[1]);show('cx');}
    else if(h==='hub'){show('hub');}
    else{show('welcome');}
  }
  function go(h){ if(location.hash==='#'+h) route(); else location.hash=h; }

  let tt;
  function toast(name){
    const t=document.getElementById('toast');
    t.textContent=`${name} is coming in the next build.`;
    t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2400);
  }

  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-go],[data-step],[data-soon]'); if(!el) return;
    if(el.dataset.go) go(el.dataset.go);
    else if(el.dataset.step){
      const n=cxStep+(+el.dataset.step);
      go(n<1?'hub':n>4?'hub':'cx-'+n);
    } else if(el.dataset.soon) toast(el.dataset.soon);
  });
  addEventListener('keydown',e=>{
    if(!document.getElementById('s-cx').classList.contains('active')) return;
    if(e.key==='ArrowRight') go(cxStep<4?'cx-'+(cxStep+1):'hub');
    if(e.key==='ArrowLeft') go(cxStep>1?'cx-'+(cxStep-1):'hub');
  });
  addEventListener('hashchange',route);
  route();
})();
</script>
</body>
</html>
